<!doctype html>
<html lang="en">
  <head>
    <script>
      const darkModeMatcher = window.matchMedia("(prefers-color-scheme: dark)");
      if (darkModeMatcher.matches) {
        document.documentElement.classList.add("dark");
      }
      const updateFavicon = (isDark) => {
        const svgIcon = document.querySelector(
          isDark ? 'link[href*="favicon.svg"]' : 'link[href*="favicon-light.svg"]',
        );
        if (svgIcon) {
          const href = svgIcon.href;
          svgIcon.href = "";
          svgIcon.href = href;
        }
      };
      darkModeMatcher.addEventListener("change", (e) => {
        document.documentElement.classList.toggle("dark", e.matches);
        updateFavicon(e.matches);
      });
      window.addEventListener("vite:preloadError", (event) => {
        window.location.reload();
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenSplit</title>
    <meta name="description" content="split bills and keep track of who owes what." />
    <!-- Default (Light) -->
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-light-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-light-16x16.png" />

    <!-- Dark Mode Override -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Fallbacks -->
    <link rel="icon" href="/favicon-light.ico" />
    <link rel="icon" href="/favicon.ico" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F0B100" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
